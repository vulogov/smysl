[package]
name         = "smysl-embed"
description  = "Semantic retrieval for a smysl store: static embeddings behind the Retriever seam."
version.workspace      = true
edition.workspace      = true
# Not the workspace base since TX-P10 step 1: `model2vec-rs` 0.3 declares 1.88, and 1.85 refuses
# it. 1.88 is the facade's floor already, so `semantic` raises nothing a build of `smysl` with it
# did not already need; what moved is this crate on its own.
rust-version           = "1.88"
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# docs.rs builds with default features unless told otherwise, which for this crate meant
# publishing a partial API: the feature-gated modules simply were not there. Set on every
# published crate rather than only the five with features today, so a crate that gains one
# later does not silently reintroduce the gap.
[package.metadata.docs.rs]
all-features = true

[dependencies]
smysl-core     = { workspace = true }
smysl-graph    = { workspace = true }
smysl-retrieve = { workspace = true }

# Departures from the defaults, which are `["onig", "hf-hub"]`: a C regex library and a network
# client.
#
# **`wasm`, which selects `fancy-regex` and not `onig`.** Oniguruma is a C library, and taking the
# default would pull it in — which nothing about the crate's name or description warns you of.
#
# **No C++ either, through `wasm` only.** Both regex features, `onig` and `fancy-regex`, enable
# `tokenizers/esaxx_fast` — in 0.3.0 as in 0.2.1 — which is `esaxx-rs/cpp`, one C++ file compiled
# through `cc`, for *training* a tokenizer, which this crate never does. 0.3.0's `wasm` feature
# is `["local-only", "tokenizers/unstable_wasm"]`: `fancy-regex` without `esaxx_fast`, so
# `esaxx-rs` stays in the tree without its C++ (verified for SMYSL-2.5 §2.2, F-11; moved here at
# TX-P10 step 1, when `xtask check-native` made it a check). Despite the name nothing here
# targets wasm; the feature is the one that leaves the C out.
#
# What is avoided either way is ONNX Runtime: a large prebuilt binary usually fetched at
# build time, or a very large source build.
#
# **No `hf-hub`**, so no `ureq`, so no code path here can reach the network. A model is three
# files the operator already has, or there is no model. That is the same posture the provider
# crates take, and it is why this lives outside `smysl-retrieve` rather than behind a feature
# in it: `smysl-retrieve` is under the purity gate, and `model2vec-rs` requires `serde_json`,
# which that gate forbids (`clap` is optional since 0.3 and not taken).
model2vec-rs = { version = "0.3", default-features = false, features = ["wasm"] }
