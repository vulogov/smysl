[package]
name        = "smysl-text"
description = "smysl text library: normalisation, parts, readings, structure, locators, object store"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# docs.rs builds with default features unless told otherwise, which for this crate meant
# publishing a partial API: the feature-gated modules simply were not there. Set on every
# published crate rather than only the five with features today, so a crate that gains one
# later does not silently reintroduce the gap.
[package.metadata.docs.rs]
all-features = true

# `default = []` is the tree the purity gate checks (SMYSL-2.4 §4.5, OQ-37). The readers that
# need a serde stack arrive in TX-P1 step 3, each behind its own `reader-*` feature, and the
# gate checks this crate at `--all-features` as well — a runtime behind one reader feature
# would otherwise have passed a check that only looked at the defaults.
[features]
default = []

# One feature per reader, as the gate's second list requires: a dependency that enters with a
# reader is recorded against that reader rather than against the crate. `reader-txt` needs
# nothing but std, which is why it is the one step 3 starts with — the contract gets tested
# before any parser is argued about.
reader-txt = []
reader-usfm = []
reader-md = ["dep:pulldown-cmark"]
reader-json = ["dep:serde", "dep:serde_json"]
reader-osis = ["dep:quick-xml"]
reader-zefania = ["dep:quick-xml"]

[dependencies]
smysl-core            = { workspace = true }
unicode-normalization = { workspace = true }
pulldown-cmark        = { workspace = true, optional = true }
serde                 = { workspace = true, optional = true }
serde_json            = { workspace = true, optional = true }
quick-xml             = { workspace = true, optional = true }
