[package]
name        = "smysl-lib"
description = "smysl library import and export: inclusion closure, canonical collections, round trips"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# Set on every published crate, as the others do, so a feature added later is documented.
[package.metadata.docs.rs]
all-features = true

[features]
default = []

[dependencies]
# Records, their encoding, identities and the diagnostic registry: what an export file is made of.
smysl-core = { workspace = true }
# The snapshot an export cuts: `Store`, its adjacency and `closure`, `rebuttals_of` (rule R),
# and `record_set_digest`, the one digest function P1 compares (SMYSL-2.7 §3.7). It is a pure
# crate, so the pure tree gains no runtime.
smysl-graph = { workspace = true }
# The hash suffix of a generated view id (§3.4). Already in the tree, `pure`.
blake3 = { workspace = true }
# Import classifies what it reads by the check's findings (§3.3). Pure.
smysl-check = { workspace = true }
# The library an import writes into, behind `LibraryWrite`, and the part policy its manifests
# record (§3.1). Pure; no reader feature is needed, since import reads smysl files only.
smysl-text = { workspace = true }
# `--scope` is an `sq/1` query, planned and run as `q` runs one, and `by-query` groups by a
# `group by` field (TX-P11 step 8). Pure, and already below `smysl-text`.
smysl-query = { workspace = true }
# `--format pack` packs each file's selection as `smysl pack` does (TX-P11 step 10). Pure.
smysl-pack = { workspace = true }

[dev-dependencies]
# The five-Bible corpus of `tests/text.rs` is USFM, and the chats of `tests/time.rs` WhatsApp
# and Telegram, added through the library as `text add` adds them. Tests only: import itself
# reads smysl files and needs no reader.
smysl-text = { workspace = true, features = ["reader-usfm", "reader-whatsapp", "reader-telegram"] }
# `tests/scope.rs` builds a plain store's query ports, as `smysl q` does.
smysl-query = { workspace = true }

# The selection, closure and layout tests of TX-P11 step 2 (SMYSL-2.7 §5.1), over the corpus.
[[test]]
name = "export"

# The index, `verify`, `ref` closure and the duplication factor of TX-P11 step 3 (SMYSL-2.7 §6).
[[test]]
name = "verify"

# Import, staging, waiting, quarantine and the tables of TX-P11 step 4 (SMYSL-2.7 §5.1).
[[test]]
name = "import"

# Text in collections, `by-expression` and `by-collection`, and rule Z at the door, of TX-P11
# step 6 (SMYSL-2.7 §3.2, §3.4, §3.6).
[[test]]
name = "text"

# `by-time` and `--as-of`, of TX-P11 step 7 (SMYSL-2.7 §3.4, §3.10).
[[test]]
name = "time"

# `--scope` as an `sq` query, `by-query`, and P3 from `import:<…>`, of TX-P11 step 8
# (SMYSL-2.7 §3.6, §3.9).
[[test]]
name = "scope"

# Span re-verification at import and the two joins, of TX-P11 step 9 (SMYSL-2.7 §3.2, §3.5).
[[test]]
name = "join"

# The `surface` and `pack` formats, of TX-P11 step 10 (SMYSL-2.7 §3.8).
[[test]]
name = "format"

# The cross-implementation harness and the record-set digest vectors, of TX-P11 step 11
# (SMYSL-2.7 §5.4). Skips an implementation whose toolchain is absent unless
# `SMYSL_XI_REQUIRED` is set.
[[test]]
name = "cross_impl"

# GE-T15, the round-trip gate of TX-P11 (SMYSL-2.7 §5.2, step 12; gate G2). The scale cells
# at 10⁵ and 10⁶ records are `--ignored`.
[[test]]
name = "ge_t15"
