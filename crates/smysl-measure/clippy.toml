# SMYSL-2.6 §3.5: every transcendental goes through `libm` (`src/num.rs`), never the platform's.
# A method here is one whose result differs in the last bit between libms, and a last bit can
# move a payload number. Scoped to this crate, which is the only one whose outputs are
# identities computed from floats.
disallowed-methods = [
    { path = "f64::ln",    reason = "use crate::num::ln (libm), SMYSL-2.6 §3.5" },
    { path = "f64::log2",  reason = "use crate::num::log2 (libm), SMYSL-2.6 §3.5" },
    { path = "f64::log10", reason = "use libm through crate::num, SMYSL-2.6 §3.5" },
    { path = "f64::exp",   reason = "use crate::num::exp (libm), SMYSL-2.6 §3.5" },
    { path = "f64::powf",  reason = "use crate::num::powf (libm), SMYSL-2.6 §3.5" },
    { path = "f64::powi",  reason = "use crate::num::powf, or a product in a fixed order, SMYSL-2.6 §3.5" },
    { path = "f64::ln_1p", reason = "use libm through crate::num, SMYSL-2.6 §3.5" },
    { path = "f64::exp_m1", reason = "use libm through crate::num, SMYSL-2.6 §3.5" },
    { path = "f32::ln",    reason = "measures accumulate in f64 through crate::num, SMYSL-2.6 §3.5" },
    { path = "f32::exp",   reason = "measures accumulate in f64 through crate::num, SMYSL-2.6 §3.5" },
    { path = "f32::powf",  reason = "measures accumulate in f64 through crate::num, SMYSL-2.6 §3.5" },
]
