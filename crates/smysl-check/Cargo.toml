[package]
name        = "smysl-check"
description = "smysl conformance, epistemic, and structural check passes"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# docs.rs builds with default features unless told otherwise, which for this crate meant
# publishing a partial API: the feature-gated modules simply were not there. Set on every
# published crate rather than only the five with features today, so a crate that gains one
# later does not silently reintroduce the gap.
[package.metadata.docs.rs]
all-features = true

[features]
# The `Time` pass (RFC SMYSL-2.4 §4.3, TX-P3 step 3). Behind a feature because rule E's engine
# lives in `smysl-text` — the calendar arithmetic and the EDTF extent are there — and a
# dependency direction this crate did not have before is worth opting into. §4.1 sanctions it:
# `smysl-text` has no `smysl-check` dependency, so the edge adds no cycle, and `smysl-text`'s
# default tree is pure, so it adds no crates either.
#
# With the feature off, `Pass::Time` is in `ALL` and not in `IMPLEMENTED`, so a report says the
# pass did not run — the machinery `Pass::Codec`, `Retraction` and `Hashes` already use. A
# caller reads that rather than inferring it from silence.
text = ["dep:smysl-text"]

[dependencies]
smysl-core  = { workspace = true }
smysl-graph = { workspace = true }
smysl-text  = { workspace = true, optional = true }
