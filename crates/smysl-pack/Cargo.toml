[package]
name        = "smysl-pack"
description = "smysl budget-bounded, closure-complete packing"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# docs.rs builds with default features unless told otherwise, which for this crate meant
# publishing a partial API: the feature-gated modules simply were not there. Set on every
# published crate rather than only the five with features today, so a crate that gains one
# later does not silently reintroduce the gap.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Exact packing via branch-and-bound over a fractional relaxation bound (SM-P10).
branch-and-bound = []

[dependencies]
smysl-core  = { workspace = true }
smysl-graph = { workspace = true }
