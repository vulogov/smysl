[package]
name        = "smysl-eval"
description = "smysl evaluation harness (E1-E9). Not published."
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dev-dependencies]
# The prose arm needs a model at every hop. A dev-dependency, so the crate itself still
# links no HTTP client and `Summariser`/`Judge` stay ports rather than provider types.
smysl-provider = { workspace = true, features = ["gemini", "deepseek"] }
# The quoting experiment needs the shipped ingest prompt, because the arm under test is
# *that* prompt minus one paragraph. Reconstructing it here would measure a copy.
smysl-ingest = { workspace = true, features = ["model"] }

[dependencies]
smysl-core  = { workspace = true }
smysl-graph = { workspace = true }
smysl-check = { workspace = true }
smysl-pack  = { workspace = true }
# E6's count, which SMYSL-2.6 §4.3 moves into A5 (`graph::grounding`, TX-P9 N1) so that the
# harness and the measure are one implementation. Default features: the pure tier's tree.
smysl-measure = { workspace = true }
