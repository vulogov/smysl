[package]
name        = "smysl-eval"
description = "smysl evaluation harness (E1-E9). Not published."
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dev-dependencies]
# The prose arm needs a model at every hop. A dev-dependency, so the crate itself still
# links no HTTP client and `Summariser`/`Judge` stay ports rather than provider types.
smysl-provider = { workspace = true, features = ["gemini", "deepseek"] }

[dependencies]
smysl-core  = { workspace = true }
smysl-graph = { workspace = true }
smysl-check = { workspace = true }
smysl-pack  = { workspace = true }
