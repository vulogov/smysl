[package]
name        = "smysl-provider"
description = "smysl provider layer: the only crate that links a runtime or an HTTP client"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
default = []
# Linked only when a mapper needs it, so the trait, the registry and the ledger build and
# test without an HTTP client in the tree.
http-client = ["dep:ureq"]
# TLS, needed only by hosted providers. Ollama is loopback HTTP, so a local-only build
# links no TLS stack at all.
tls = ["http-client", "ureq/tls"]
# One feature per mapper (§21.2). Ollama is the CI conformance reference: it is the only
# provider exercisable without keys, cost, or egress.
ollama    = ["http-client"]
anthropic = ["tls"]
openai    = ["tls"]
gemini    = ["tls"]
deepseek  = ["tls"]
# D-3: rustls with the ring provider by default; `tls-pure` selects rustls-rustcrypto.
tls-pure  = []

[dependencies]
smysl-core = { workspace = true }
tokio      = { workspace = true }
ureq       = { workspace = true, optional = true }
serde      = { workspace = true }
serde_json = { workspace = true }
