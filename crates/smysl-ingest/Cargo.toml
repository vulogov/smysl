[package]
name        = "smysl-ingest"
description = "smysl ingest boundary: staging, repair, trust ceiling, recipes"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# docs.rs builds with default features unless told otherwise, which for this crate meant
# publishing a partial API: the feature-gated modules simply were not there. Set on every
# published crate rather than only the five with features today, so a crate that gains one
# later does not silently reintroduce the gap.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Mirrors of the provider crate's mapper features, so the live gate test can name the
# providers this build can actually drive.
ollama    = ["smysl-provider/ollama"]
anthropic = ["smysl-provider/anthropic"]
openai    = ["smysl-provider/openai"]
gemini    = ["smysl-provider/gemini"]
deepseek  = ["smysl-provider/deepseek"]

[dependencies]
smysl-core     = { workspace = true }
smysl-check    = { workspace = true }
smysl-graph    = { workspace = true }
smysl-provider = { workspace = true }
