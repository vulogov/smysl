[package]
name        = "smysl-ingest"
description = "smysl ingest boundary: staging, repair, trust ceiling, recipes"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# docs.rs builds with default features unless told otherwise, which for this crate meant
# publishing a partial API: the feature-gated modules simply were not there. Set on every
# published crate rather than only the five with features today, so a crate that gains one
# later does not silently reintroduce the gap.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["model"]
# Calling a model: `Ingestor`, `attest`, and the path choice that reads provider capabilities.
# Default, so a dependent that asked for `smysl-ingest` gets what it always got. Without it the
# crate is staging, rule T and M, conversion and recipes — what a caller that builds its own
# units needs, with no provider layer linked.
model     = ["dep:smysl-provider"]
# Mirrors of the provider crate's mapper features, so the live gate test can name the
# providers this build can actually drive.
ollama    = ["model", "smysl-provider/ollama"]
anthropic = ["model", "smysl-provider/anthropic"]
openai    = ["model", "smysl-provider/openai"]
gemini    = ["model", "smysl-provider/gemini"]
deepseek  = ["model", "smysl-provider/deepseek"]

[dependencies]
smysl-core     = { workspace = true }
smysl-check    = { workspace = true }
smysl-graph    = { workspace = true }
smysl-provider = { workspace = true, optional = true }

# Both drive `Ingestor` against providers, so neither exists without `model`.
[[test]]
name              = "gate"
required-features = ["model"]

[[test]]
name              = "providers_live"
required-features = ["model"]
