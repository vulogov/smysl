[package]
name        = "smysl-core"
description = "smysl kernel types, deterministic codec, surface syntax, diagnostics"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# docs.rs builds with default features unless told otherwise, which for this crate meant
# publishing a partial API: the feature-gated modules simply were not there. Set on every
# published crate rather than only the five with features today, so a crate that gains one
# later does not silently reintroduce the gap.
[package.metadata.docs.rs]
all-features = true

[dependencies]
blake3                = { workspace = true }
unicode-normalization = { workspace = true }
