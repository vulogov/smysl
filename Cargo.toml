[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.79"
license      = "MPL-2.0"
authors      = ["Vladimir Ulogov"]
repository   = "https://github.com/vulogov/smysl"

[workspace.dependencies]
smysl-core     = { path = "crates/smysl-core",     version = "0.1.0" }
smysl-graph    = { path = "crates/smysl-graph",    version = "0.1.0" }
smysl-check    = { path = "crates/smysl-check",    version = "0.1.0" }
smysl-pack     = { path = "crates/smysl-pack",     version = "0.1.0" }
smysl-thread   = { path = "crates/smysl-thread",   version = "0.1.0" }
smysl-render   = { path = "crates/smysl-render",   version = "0.1.0" }
smysl-provider = { path = "crates/smysl-provider", version = "0.1.0" }
smysl-ingest   = { path = "crates/smysl-ingest",   version = "0.1.0" }
smysl-tui      = { path = "crates/smysl-tui",      version = "0.1.0" }

# `pure` keeps the C SIMD backend out of the build: zero C in the core path (§13).
blake3                = { version = "1", default-features = false, features = ["std", "pure"] }
unicode-normalization = "0.1"
deser-hjson           = "2"
clap                  = { version = "4", features = ["derive"] }
ratatui               = "0.29"
crossterm             = "0.28"
tokio                 = { version = "1", features = ["rt", "sync", "macros"] }
ureq                  = { version = "2", default-features = false }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"

# ---------------------------------------------------------------------------
# Facade crate: [lib] + [[bin]] (RFC SMYSL-1 §12.1)
# ---------------------------------------------------------------------------
[package]
name         = "smysl"
description  = "An AI<->AI<->Human data interchange format, library, and CLI"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name = "smysl"
path = "src/lib.rs"

[[bin]]
name              = "smysl"
path              = "src/main.rs"
required-features = ["cli"]

[features]
default   = ["cli", "tui", "local", "render-typst"]
cli       = ["dep:clap"]
tui       = ["dep:smysl-tui", "cli"]
providers = ["dep:smysl-provider"]
ingest    = ["dep:smysl-ingest", "providers"]
local     = ["ingest", "smysl-provider/ollama"]
remote    = [
    "ingest",
    "smysl-provider/anthropic",
    "smysl-provider/openai",
    "smysl-provider/gemini",
    "smysl-provider/deepseek",
]
render-typst = ["smysl-render/typst"]
render-html  = ["smysl-render/html"]
exact-pack   = ["smysl-pack/branch-and-bound"]
tls-pure     = ["smysl-provider/tls-pure"]

[dependencies]
smysl-core     = { workspace = true }
smysl-graph    = { workspace = true }
smysl-check    = { workspace = true }
smysl-pack     = { workspace = true }
smysl-thread   = { workspace = true }
smysl-render   = { workspace = true }
smysl-provider = { workspace = true, optional = true }
smysl-ingest   = { workspace = true, optional = true }
smysl-tui      = { workspace = true, optional = true }
clap           = { workspace = true, optional = true }
