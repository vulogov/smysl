[workspace]
members  = ["crates/*", "xtask"]
exclude  = ["fuzz"]
resolver = "2"

[workspace.package]
version      = "1.2.0"
edition      = "2021"
rust-version = "1.79"
license      = "MPL-2.0"
authors      = ["Vladimir Ulogov"]
repository   = "https://github.com/vulogov/smysl"

[workspace.dependencies]
smysl-core     = { path = "crates/smysl-core",     version = "1.1.0" }
smysl-graph    = { path = "crates/smysl-graph",    version = "1.1.0" }
smysl-check    = { path = "crates/smysl-check",    version = "1.1.0" }
smysl-pack     = { path = "crates/smysl-pack",     version = "1.1.0" }
smysl-thread   = { path = "crates/smysl-thread",   version = "1.1.0" }
smysl-render   = { path = "crates/smysl-render",   version = "1.1.0" }
smysl-retrieve = { path = "crates/smysl-retrieve", version = "1.1.0" }
smysl-embed    = { path = "crates/smysl-embed",    version = "1.1.0" }
smysl-provider = { path = "crates/smysl-provider", version = "1.1.0" }
smysl-ingest   = { path = "crates/smysl-ingest",   version = "1.1.0" }
smysl-tui      = { path = "crates/smysl-tui",      version = "1.1.0" }

# `pure` keeps the C SIMD backend out of the build: zero C in the core path (§13).
blake3                = { version = "1", default-features = false, features = ["std", "pure"] }
unicode-normalization = "0.1"
deser-hjson           = "2"
clap                  = { version = "4", features = ["derive"] }
ratatui               = "0.29"
crossterm             = "0.28"
tokio                 = { version = "1", features = ["rt", "sync", "macros"] }
ureq                  = { version = "2", default-features = false }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"

# ---------------------------------------------------------------------------
# Facade crate: [lib] + [[bin]] (RFC SMYSL-1 §12.1)
# ---------------------------------------------------------------------------
[package]
name         = "smysl"
description  = "An AI<->AI<->Human data interchange format, library, and CLI"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# What a consumer of the crate does not need to download.
#
# The manual is 5.9 MB of PDF and the images another 2 MB, against a 10 MB crate limit — so
# most of the package would have been a book nobody unpacked, and the headroom left for the
# code would have been whatever remained. The typst sources stay: they are small, they are
# the thing that changes, and a reader who wants the book can build it.
#
# `fixtures/` stays too, at 308 KB, because the conformance suite is part of what makes the
# format checkable by someone else.
exclude = [
    "Documentation/*.pdf",
    "Documentation/images/**",
    "fuzz/**",
    ".github/**",
]

# docs.rs builds with default features unless told otherwise, which for this crate meant
# publishing a partial API: the feature-gated modules simply were not there. Set on every
# published crate rather than only the five with features today, so a crate that gains one
# later does not silently reintroduce the gap.
[package.metadata.docs.rs]
all-features = true

[lib]
name = "smysl"
path = "src/lib.rs"

[[bin]]
name              = "smysl"
path              = "src/main.rs"
required-features = ["cli"]

[features]
# `tui` is deliberately absent. It works and it is tested, but `ratatui` and `crossterm` in
# every default build is a cost an embedder who only calls the library never opted into.
# `--features tui` for anyone who wants the browser; free for everyone else.
default   = ["cli", "local", "render-typst"]
cli       = ["dep:clap"]
tui       = ["dep:smysl-tui", "cli"]
# Semantic retrieval. Off by default: it needs a model file the operator supplies, and a
# build that cannot use one should not pay for `tokenizers` in its dependency tree.
semantic  = ["dep:smysl-embed"]
providers = ["dep:smysl-provider"]
ingest    = ["dep:smysl-ingest", "providers"]
local     = ["ingest", "smysl-provider/ollama", "smysl-ingest/ollama"]
remote    = [
    "ingest",
    "smysl-provider/anthropic",
    "smysl-provider/openai",
    "smysl-provider/gemini",
    "smysl-provider/deepseek",
    "smysl-ingest/anthropic",
    "smysl-ingest/openai",
    "smysl-ingest/gemini",
    "smysl-ingest/deepseek",
]
render-typst = ["smysl-render/typst"]
render-html  = ["smysl-render/html"]
exact-pack   = ["smysl-pack/branch-and-bound"]
tls-pure     = ["smysl-provider/tls-pure"]

[dependencies]
smysl-core     = { workspace = true }
smysl-graph    = { workspace = true }
smysl-retrieve = { workspace = true }
smysl-check    = { workspace = true }
smysl-pack     = { workspace = true }
smysl-thread   = { workspace = true }
smysl-render   = { workspace = true }
smysl-provider = { workspace = true, optional = true }
smysl-ingest   = { workspace = true, optional = true }
smysl-tui      = { workspace = true, optional = true }
smysl-embed    = { workspace = true, optional = true }
clap           = { workspace = true, optional = true }

[dev-dependencies]
# The global-flag matrix test parses `--json` output with a real parser rather than
# pattern-matching it: machine-readable output that a machine cannot read is the bug
# being guarded against, so the guard has to be a parser.
serde_json = { workspace = true }
