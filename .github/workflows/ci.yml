name: ci

on:
  push:
    # Development branches too, not just `main`. Running only on `main` meant CI first saw
    # a cycle's work at the release commit, which is how the determinism job stayed red
    # across 0.2.0, 0.3.0 and 0.4.0: nobody was watching a branch that never got a run, and
    # by the time it did the release was already cut.
    branches: [main, "dev/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  # Feature combinations, because the interesting bugs live in the seams between them.
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - ""
          - "--all-features"
          - "--no-default-features --features local"
          - "--no-default-features --features remote"
          - "--no-default-features --features exact-pack"
          - "--no-default-features --features render-typst,render-html"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace ${{ matrix.features }}

  # Rules A and B: the library must stay synchronous and network-free.
  purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-purity

  # Rule D: every pure operation is bit-reproducible across locale, timezone, and hash
  # seed.
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the ru_RU.UTF-8 locale used by the permutation matrix
        run: |
          sudo locale-gen ru_RU.UTF-8
          sudo update-locale
      # Echo the failure into an annotation, not just the log. Job logs and uploaded
      # artifacts both need admin rights on this repository, so a maintainer without them
      # sees "exit code 1" and nothing else — which is how this job stayed red across three
      # releases while passing on every machine it could be run on. Annotations are readable
      # through the public API, so the reason travels with the failure.
      - name: determinism
        run: |
          set -o pipefail
          cargo xtask determinism 2>&1 | tee /tmp/det.log || {
            echo "::error title=determinism::$(tail -c 3000 /tmp/det.log | tr '\n' '|')"
            exit 1
          }

  # G7 stated as a build failure rather than an intention: if a pure crate ever acquires
  # a network dependency, this job fails instead of the property quietly lapsing.
  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Vendor dependencies while the network is still available
        run: cargo fetch --locked || cargo fetch
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, so
      # `unshare --map-root-user` fails with "write failed /proc/self/uid_map". Lifting
      # that restriction is what keeps this job asserting the real property - a sandbox
      # that silently stopped sandboxing would be worse than no job at all.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build and test the pure crates with networking denied
        run: |
          unshare --map-root-user --net -- \
            cargo test --offline --no-default-features \
              -p smysl-core -p smysl-graph -p smysl-check \
              -p smysl-pack -p smysl-thread -p smysl-render

  # The SM-P13 gate's live half. Ollama is the conformance reference because it is the
  # only provider exercisable without keys, cost, or egress - so this job asserts the
  # mapper against a real server rather than against a remembered API.
  ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Ollama and pull the reference model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 1
          done
          ollama pull llama3.2
      # `required` turns the skip into a failure: a live test that quietly skips in CI is
      # a live test nobody runs.
      - run: SMYSL_OLLAMA=required cargo test -p smysl-provider --features ollama
      # The SM-P14 gate's first clause, as far as a keyless runner can take it: the same
      # fixture through the whole ingest boundary against a real model.
      - run: SMYSL_OLLAMA=required cargo test -p smysl-ingest --features ollama

  # The conformance suite runs against the built binary, not the library, so a second
  # implementation can be substituted for it.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test conformance_fixtures --no-default-features

  # The manual prints 43 replayable command transcripts, and until 0.4 nothing checked that
  # the binary still produced them. A teaching document whose transcripts have quietly
  # drifted is worse than one with none: a reader who types the command and gets something
  # else has no way to tell which of the two is wrong.
  #
  # The script exits non-zero on drift as of 0.4. It could not before, because it reported
  # fifteen permanent mismatches — every one an artifact of how it captured output rather
  # than a stale manual. Concatenating two separately-captured streams does not reproduce
  # the order a terminal shows, and a block quoting one stream, or eliding with `...`, could
  # never match. Fixed at the source, so a gate here means something.
  doc-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make doc-output

  # Both fuzz targets existed from the start and nothing ever ran them, which is how two
  # stack overflows survived to 0.3: the surface parser aborted at ~5 000 nesting levels and
  # the CBOR reader at ~20 000, both reachable from input another agent hands you. A fuzzer
  # finds those in seconds. A fuzz target nobody runs is a test that does not exist.
  #
  # Time-boxed so this stays a gate rather than a bottleneck: sixty seconds each is enough to
  # catch a regression of that shape, and short enough that nobody is tempted to skip it.
  # Nightly, because `cargo fuzz` needs it.
  fuzz:
    runs-on: ubuntu-latest
    # Blocking, as of 0.4.0. It ran as reporting-only while it worked through the backlog it
    # discovered on its first run — eight defects that had been in the tree since before 0.2,
    # none of them regressions, all of them simply what nobody had looked for. That backlog is
    # clear: both targets now run for minutes without a finding, and every case is pinned by a
    # regression test. A gate that fails on a backlog it just found teaches people to ignore
    # it; a gate with nothing outstanding is just a gate.
    #
    # Seeding the corpus would make each run reach further than a cold start does. Left for
    # later, and noted rather than quietly skipped: sixty seconds from cold still catches the
    # regressions this is here to catch.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # The crash input, base64 in an annotation, for the same reason: the uploaded artifact
      # below needs admin rights to download, so without this a fuzz failure is a report that
      # something broke with no way to reproduce it.
      - name: surface parser
        run: |
          ls fuzz/artifacts/surface > /tmp/before-surface.txt 2>/dev/null || true
          cargo +nightly fuzz run surface -- -max_total_time=60 || {
            ls fuzz/artifacts/surface > /tmp/after-surface.txt 2>/dev/null || true
            for f in $(comm -13 /tmp/before-surface.txt /tmp/after-surface.txt); do
              echo "::error title=surface-crash::$f = $(base64 -w0 fuzz/artifacts/surface/$f)"
            done
            exit 1
          }
      - name: cbor codec
        run: |
          ls fuzz/artifacts/cbor > /tmp/before-cbor.txt 2>/dev/null || true
          cargo +nightly fuzz run cbor -- -max_total_time=60 || {
            ls fuzz/artifacts/cbor > /tmp/after-cbor.txt 2>/dev/null || true
            for f in $(comm -13 /tmp/before-cbor.txt /tmp/after-cbor.txt); do
              echo "::error title=cbor-crash::$f = $(base64 -w0 fuzz/artifacts/cbor/$f)"
            done
            exit 1
          }
      # The algebra targets. Rule U's join-semilattice laws, pack's C1-C7, and rule L with
      # guarantee A1 across the pipeline — the same properties the seeded tests assert,
      # searched by coverage feedback rather than by a fixed seed and 200 blind rounds.
      # These are where a defect is *quiet*: a wrong merge still merges, a wrong pack still
      # packs, and neither raises a diagnostic on the way past.
      - name: algebra
        run: |
          for t in merge_algebra pack_constraints pipeline pack_exact; do
            ls fuzz/artifacts/$t > /tmp/before-$t.txt 2>/dev/null || true
            cargo +nightly fuzz run $t -- -max_total_time=60 || {
              ls fuzz/artifacts/$t > /tmp/after-$t.txt 2>/dev/null || true
              for f in $(comm -13 /tmp/before-$t.txt /tmp/after-$t.txt); do
                echo "::error title=$t-crash::$f = $(base64 -w0 fuzz/artifacts/$t/$f)"
              done
              exit 1
            }
          done
      # A crash leaves its input behind; publish it so the failure is reproducible rather
      # than merely reported.
      - name: upload any crash found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
