name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  # Feature combinations, because the interesting bugs live in the seams between them.
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - ""
          - "--all-features"
          - "--no-default-features --features local"
          - "--no-default-features --features remote"
          - "--no-default-features --features exact-pack"
          - "--no-default-features --features render-typst,render-html"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace ${{ matrix.features }}

  # Rules A and B: the library must stay synchronous and network-free.
  purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-purity

  # Rule D: every pure operation is bit-reproducible across locale, timezone, and hash
  # seed.
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the ru_RU.UTF-8 locale used by the permutation matrix
        run: |
          sudo locale-gen ru_RU.UTF-8
          sudo update-locale
      - run: cargo xtask determinism

  # G7 stated as a build failure rather than an intention: if a pure crate ever acquires
  # a network dependency, this job fails instead of the property quietly lapsing.
  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Vendor dependencies while the network is still available
        run: cargo fetch --locked || cargo fetch
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, so
      # `unshare --map-root-user` fails with "write failed /proc/self/uid_map". Lifting
      # that restriction is what keeps this job asserting the real property - a sandbox
      # that silently stopped sandboxing would be worse than no job at all.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build and test the pure crates with networking denied
        run: |
          unshare --map-root-user --net -- \
            cargo test --offline --no-default-features \
              -p smysl-core -p smysl-graph -p smysl-check \
              -p smysl-pack -p smysl-thread -p smysl-render

  # The SM-P13 gate's live half. Ollama is the conformance reference because it is the
  # only provider exercisable without keys, cost, or egress - so this job asserts the
  # mapper against a real server rather than against a remembered API.
  ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Ollama and pull the reference model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 1
          done
          ollama pull llama3.2
      # `required` turns the skip into a failure: a live test that quietly skips in CI is
      # a live test nobody runs.
      - run: SMYSL_OLLAMA=required cargo test -p smysl-provider --features ollama
      # The SM-P14 gate's first clause, as far as a keyless runner can take it: the same
      # fixture through the whole ingest boundary against a real model.
      - run: SMYSL_OLLAMA=required cargo test -p smysl-ingest --features ollama

  # The conformance suite runs against the built binary, not the library, so a second
  # implementation can be substituted for it.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test conformance_fixtures --no-default-features

  # Both fuzz targets existed from the start and nothing ever ran them, which is how two
  # stack overflows survived to 0.3: the surface parser aborted at ~5 000 nesting levels and
  # the CBOR reader at ~20 000, both reachable from input another agent hands you. A fuzzer
  # finds those in seconds. A fuzz target nobody runs is a test that does not exist.
  #
  # Time-boxed so this stays a gate rather than a bottleneck: sixty seconds each is enough to
  # catch a regression of that shape, and short enough that nobody is tempted to skip it.
  # Nightly, because `cargo fuzz` needs it.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: surface parser
        run: cargo +nightly fuzz run surface -- -max_total_time=60
      - name: cbor codec
        run: cargo +nightly fuzz run cbor -- -max_total_time=60
      # A crash leaves its input behind; publish it so the failure is reproducible rather
      # than merely reported.
      - name: upload any crash found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
